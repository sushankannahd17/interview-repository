name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/interview_platform_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/interview_platform_test
          JWT_SECRET_KEY: test-secret
          TEAM_B_API_KEY: test-key
          ENVIRONMENT: test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/interview_platform_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/interview_platform_test
          JWT_SECRET_KEY: test-secret
          TEAM_B_API_KEY: test-key
          ENVIRONMENT: test
        run: pytest --tb=short -v --cov=app --cov-report=term-missing
